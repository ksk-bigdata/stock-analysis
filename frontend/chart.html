<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>차트 분석 — KR Stock</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
  <nav>
    <a class="nav-logo" href="/">KR Stock</a>
    <div class="nav-links">
      <a href="/">홈</a>
      <a href="/screener">종목 추천</a>
    </div>
    <div class="search-bar">
      <div class="search-wrapper">
        <input id="nav-search" type="text" placeholder="종목명 또는 코드 검색">
        <div class="search-dropdown" id="nav-dropdown"></div>
      </div>
      <button onclick="navSearch()">검색</button>
    </div>
  </nav>

  <div class="container">
    <!-- 종목 헤더 -->
    <div id="stock-header" class="flex gap-16" style="align-items:flex-start; margin-bottom:20px">
      <div class="loading"><div class="spinner"></div></div>
    </div>

    <!-- 기본정보 바 -->
    <div class="fundamental-bar" id="fundamental-bar" style="display:none">
      <div class="fundamental-item"><div class="fundamental-label">시가총액</div><div class="fundamental-value" id="f-mktcap">-</div></div>
      <div class="fundamental-item"><div class="fundamental-label">PER</div><div class="fundamental-value" id="f-per">-</div></div>
      <div class="fundamental-item"><div class="fundamental-label">PBR</div><div class="fundamental-value" id="f-pbr">-</div></div>
      <div class="fundamental-item"><div class="fundamental-label">배당수익률</div><div class="fundamental-value" id="f-div">-</div></div>
      <div class="fundamental-item"><div class="fundamental-label">52주 최고</div><div class="fundamental-value up" id="f-high">-</div></div>
      <div class="fundamental-item"><div class="fundamental-label">52주 최저</div><div class="fundamental-value down" id="f-low">-</div></div>
    </div>

    <!-- 차트 -->
    <div class="card" style="margin-bottom:16px">
      <div class="flex" style="align-items:center; justify-content:space-between; margin-bottom:12px">
        <div class="period-tabs" id="period-tabs">
          <button class="btn btn-outline active" onclick="changePeriod(90,this)">3개월</button>
          <button class="btn btn-outline" onclick="changePeriod(180,this)">6개월</button>
          <button class="btn btn-outline" onclick="changePeriod(365,this)">1년</button>
          <button class="btn btn-outline" onclick="changePeriod(730,this)">2년</button>
        </div>
        <div class="indicator-tabs">
          <button class="btn btn-outline active" id="tab-ma" onclick="toggleMA(this)">이동평균</button>
          <button class="btn btn-outline active" id="tab-bb" onclick="toggleBB(this)">볼린저밴드</button>
          <button class="btn btn-outline active" id="tab-vol" onclick="toggleVol(this)">거래량</button>
        </div>
      </div>
      <div id="chart-container"></div>
    </div>

    <!-- 보조지표 (RSI / MACD) -->
    <div class="card" style="margin-bottom:16px">
      <div class="indicator-tabs">
        <button class="btn btn-outline active" onclick="showIndicator('rsi', this)">RSI</button>
        <button class="btn btn-outline" onclick="showIndicator('macd', this)">MACD</button>
      </div>
      <div id="indicator-container"></div>
    </div>

    <!-- 분석 요약 -->
    <div class="grid-2" style="gap:16px">
      <div class="card">
        <div class="section-title">기술적 시그널</div>
        <div id="signals-list"><div class="loading"><div class="spinner"></div></div></div>
      </div>
      <div class="card">
        <div class="section-title">종합 점수</div>
        <div id="score-panel"><div class="loading"><div class="spinner"></div></div></div>
      </div>
    </div>
  </div>

  <script>
    const BASE = 'https://stock-analysis-i3xj.onrender.com';
    const params = new URLSearchParams(location.search);
    const CODE = params.get('code') || '005930';
    let allData = [];
    let currentPeriod = 90;
    let mainChart, candleSeries, ma5s, ma20s, ma60s, bbUpper, bbLower, bbMid, volSeries;
    let indChart, rsiSeries, macdSeries, signalSeries, histSeries;
    let showMA = true, showBB = true, showVol = true;
    let currentIndicator = 'rsi';

    // 검색
    function setupSearch(inputId, dropdownId) {
      const input = document.getElementById(inputId);
      const dropdown = document.getElementById(dropdownId);
      let timer;
      input.addEventListener('input', () => {
        clearTimeout(timer);
        const q = input.value.trim();
        if (!q) { dropdown.classList.remove('open'); return; }
        timer = setTimeout(async () => {
          const res = await fetch(`${BASE}/api/stocks/search?q=${encodeURIComponent(q)}`);
          const data = await res.json();
          if (!data.results.length) { dropdown.classList.remove('open'); return; }
          dropdown.innerHTML = data.results.map(s =>
            `<div class="search-item" onclick="goTo('${s.code}')"><span>${s.name}</span><span class="code">${s.code} <span class="market-badge">${s.market}</span></span></div>`
          ).join('');
          dropdown.classList.add('open');
        }, 250);
      });
      document.addEventListener('click', e => { if (!e.target.closest('.search-wrapper')) dropdown.classList.remove('open'); });
    }
    function goTo(code) { window.location.href = `/chart?code=${code}`; }
    function navSearch() { const v = document.getElementById('nav-search').value.trim(); if (v) goTo(v); }
    setupSearch('nav-search', 'nav-dropdown');

    // 날짜 슬라이싱
    function sliceData(days) {
      const cutoff = new Date();
      cutoff.setDate(cutoff.getDate() - days);
      return allData.filter(d => new Date(d.date) >= cutoff);
    }

    function toTS(dateStr) {
      return Math.floor(new Date(dateStr).getTime() / 1000);
    }

    function colorOf(v) { return v >= 0 ? '#f85149' : '#388bfd'; }

    function initCharts() {
      const el = document.getElementById('chart-container');
      mainChart = LightweightCharts.createChart(el, {
        layout: { background: { color: '#161b22' }, textColor: '#8b949e' },
        grid: { vertLines: { color: '#21262d' }, horzLines: { color: '#21262d' } },
        crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
        rightPriceScale: { borderColor: '#30363d' },
        timeScale: { borderColor: '#30363d', timeVisible: true },
        width: el.clientWidth,
        height: 420,
      });

      candleSeries = mainChart.addCandlestickSeries({
        upColor: '#f85149', downColor: '#388bfd',
        borderUpColor: '#f85149', borderDownColor: '#388bfd',
        wickUpColor: '#f85149', wickDownColor: '#388bfd',
      });
      ma5s = mainChart.addLineSeries({ color: '#f0b429', lineWidth: 1, priceLineVisible: false });
      ma20s = mainChart.addLineSeries({ color: '#3fb950', lineWidth: 1, priceLineVisible: false });
      ma60s = mainChart.addLineSeries({ color: '#a371f7', lineWidth: 1, priceLineVisible: false });
      bbUpper = mainChart.addLineSeries({ color: 'rgba(56,139,253,.5)', lineWidth: 1, priceLineVisible: false, lineStyle: 2 });
      bbMid = mainChart.addLineSeries({ color: 'rgba(56,139,253,.7)', lineWidth: 1, priceLineVisible: false });
      bbLower = mainChart.addLineSeries({ color: 'rgba(56,139,253,.5)', lineWidth: 1, priceLineVisible: false, lineStyle: 2 });

      // 보조 차트 (RSI/MACD)
      const indEl = document.getElementById('indicator-container');
      indChart = LightweightCharts.createChart(indEl, {
        layout: { background: { color: '#161b22' }, textColor: '#8b949e' },
        grid: { vertLines: { color: '#21262d' }, horzLines: { color: '#21262d' } },
        rightPriceScale: { borderColor: '#30363d' },
        timeScale: { borderColor: '#30363d', timeVisible: true, visible: false },
        width: indEl.clientWidth,
        height: 120,
      });
      rsiSeries = indChart.addLineSeries({ color: '#f0b429', lineWidth: 1, priceLineVisible: false });
      macdSeries = indChart.addLineSeries({ color: '#388bfd', lineWidth: 1, priceLineVisible: false });
      signalSeries = indChart.addLineSeries({ color: '#f85149', lineWidth: 1, priceLineVisible: false });
      histSeries = indChart.addHistogramSeries({ priceLineVisible: false });

      mainChart.timeScale().subscribeVisibleTimeRangeChange(range => {
        if (range) indChart.timeScale().setVisibleRange(range);
      });

      window.addEventListener('resize', () => {
        mainChart.resize(el.clientWidth, 420);
        indChart.resize(indEl.clientWidth, 120);
      });
    }

    function renderCharts(data) {
      const candle = data.map(d => ({ time: toTS(d.date), open: d.open, high: d.high, low: d.low, close: d.close }));
      candleSeries.setData(candle);

      if (showMA) {
        ma5s.setData(data.filter(d => d.ma5).map(d => ({ time: toTS(d.date), value: d.ma5 })));
        ma20s.setData(data.filter(d => d.ma20).map(d => ({ time: toTS(d.date), value: d.ma20 })));
        ma60s.setData(data.filter(d => d.ma60).map(d => ({ time: toTS(d.date), value: d.ma60 })));
      } else {
        ma5s.setData([]); ma20s.setData([]); ma60s.setData([]);
      }

      if (showBB) {
        bbUpper.setData(data.filter(d => d.bb_upper).map(d => ({ time: toTS(d.date), value: d.bb_upper })));
        bbMid.setData(data.filter(d => d.bb_mid).map(d => ({ time: toTS(d.date), value: d.bb_mid })));
        bbLower.setData(data.filter(d => d.bb_lower).map(d => ({ time: toTS(d.date), value: d.bb_lower })));
      } else {
        bbUpper.setData([]); bbMid.setData([]); bbLower.setData([]);
      }

      renderIndicator(data);
      mainChart.timeScale().fitContent();
      indChart.timeScale().fitContent();
    }

    function renderIndicator(data) {
      if (currentIndicator === 'rsi') {
        rsiSeries.applyOptions({ visible: true });
        macdSeries.applyOptions({ visible: false });
        signalSeries.applyOptions({ visible: false });
        histSeries.applyOptions({ visible: false });
        rsiSeries.setData(data.filter(d => d.rsi).map(d => ({ time: toTS(d.date), value: d.rsi })));
      } else {
        rsiSeries.applyOptions({ visible: false });
        macdSeries.applyOptions({ visible: true });
        signalSeries.applyOptions({ visible: true });
        histSeries.applyOptions({ visible: true });
        macdSeries.setData(data.filter(d => d.macd).map(d => ({ time: toTS(d.date), value: d.macd })));
        signalSeries.setData(data.filter(d => d.signal).map(d => ({ time: toTS(d.date), value: d.signal })));
        histSeries.setData(data.filter(d => d.histogram != null).map(d => ({
          time: toTS(d.date), value: d.histogram, color: d.histogram >= 0 ? '#f85149' : '#388bfd'
        })));
      }
    }

    function changePeriod(days, btn) {
      currentPeriod = days;
      document.querySelectorAll('.period-tabs .btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderCharts(sliceData(days));
    }

    function toggleMA(btn) {
      showMA = !showMA;
      btn.classList.toggle('active', showMA);
      renderCharts(sliceData(currentPeriod));
    }
    function toggleBB(btn) {
      showBB = !showBB;
      btn.classList.toggle('active', showBB);
      renderCharts(sliceData(currentPeriod));
    }
    function toggleVol(btn) { showVol = !showVol; btn.classList.toggle('active', showVol); }

    function showIndicator(type, btn) {
      currentIndicator = type;
      document.querySelectorAll('.indicator-tabs .btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderIndicator(sliceData(currentPeriod));
    }

    // 관심종목 localStorage 유틸
    function getWatchlist() { return JSON.parse(localStorage.getItem('watchlist') || '[]'); }
    function saveWatchlist(list) { localStorage.setItem('watchlist', JSON.stringify(list)); }
    function isWatched(code) { return getWatchlist().some(s => s.code === code); }
    function toggleWatchlist(code, name) {
      let list = getWatchlist();
      if (isWatched(code)) {
        list = list.filter(s => s.code !== code);
      } else {
        list.push({ code, name });
      }
      saveWatchlist(list);
      updateStarBtn(code);
    }
    function updateStarBtn(code) {
      const btn = document.getElementById('watch-btn');
      if (!btn) return;
      const watched = isWatched(code);
      btn.textContent = watched ? '★ 관심종목' : '☆ 관심종목';
      btn.style.color = watched ? '#f0b429' : '';
      btn.style.borderColor = watched ? '#f0b429' : '';
    }

    function renderHeader(info, summary) {
      const sign = summary.change >= 0 ? '+' : '';
      const cls = summary.change >= 0 ? 'up' : 'down';
      document.title = `${info.name} — KR Stock`;
      document.getElementById('stock-header').innerHTML = `
        <div>
          <div style="font-size:22px;font-weight:700">${info.name}</div>
          <div style="color:var(--text-muted);margin-top:2px">${info.code} · ${info.market}</div>
        </div>
        <div style="margin-left:auto;text-align:right;display:flex;align-items:center;gap:12px">
          <button id="watch-btn" class="btn btn-outline" onclick="toggleWatchlist('${info.code}','${info.name}')" style="font-size:13px">☆ 관심종목</button>
          <div>
            <div class="stat-value ${cls}">${summary.close.toLocaleString()}원</div>
            <div class="stat-change ${cls}">${sign}${summary.change.toLocaleString()} (${sign}${summary.change_pct}%)</div>
          </div>
        </div>`;
      updateStarBtn(info.code);
    }

    function scoreColor(s) {
      if (s >= 75) return '#3fb950';
      if (s >= 55) return '#f0b429';
      return '#f85149';
    }
    function scoreLabel(s) {
      if (s >= 75) return '강력 매수';
      if (s >= 65) return '매수';
      if (s >= 55) return '중립+';
      if (s >= 45) return '중립';
      if (s >= 35) return '중립-';
      return '매도';
    }

    function renderSignalsAndScore(data) {
      const latest = data && data.length > 0 ? data[data.length - 1] : null;
      if (!latest) {
        document.getElementById('signals-list').innerHTML = '<div style="color:var(--text-muted)">데이터 없음</div>';
        document.getElementById('score-panel').innerHTML = '<div style="color:var(--text-muted)">데이터 없음</div>';
        return;
      }

      // 간단 시그널 계산 (프론트)
      const signals = [];
      if (latest.rsi != null) {
        if (latest.rsi < 30) signals.push({type:'buy', label:`RSI 과매도 (${latest.rsi})`});
        else if (latest.rsi <= 50) signals.push({type:'buy', label:`RSI 매수구간 (${latest.rsi})`});
        else if (latest.rsi > 70) signals.push({type:'sell', label:`RSI 과매수 (${latest.rsi})`});
      }
      if (latest.macd != null && latest.signal != null) {
        if (latest.macd > latest.signal) signals.push({type:'buy', label:'MACD 매수'});
        else signals.push({type:'sell', label:'MACD 매도'});
      }
      if (latest.close != null && latest.bb_lower != null) {
        if (latest.close <= latest.bb_lower) signals.push({type:'buy', label:'볼린저밴드 하단'});
        else if (latest.close >= latest.bb_upper) signals.push({type:'sell', label:'볼린저밴드 상단'});
      }
      if (latest.close && latest.ma5 && latest.ma20 && latest.ma60) {
        if (latest.close > latest.ma5 && latest.ma5 > latest.ma20 && latest.ma20 > latest.ma60)
          signals.push({type:'buy', label:'이동평균 정배열'});
        else if (latest.close < latest.ma5 && latest.ma5 < latest.ma20 && latest.ma20 < latest.ma60)
          signals.push({type:'sell', label:'이동평균 역배열'});
      }

      const buyCount = signals.filter(s => s.type === 'buy').length;
      const sellCount = signals.filter(s => s.type === 'sell').length;
      let score = 50 + buyCount * 10 - sellCount * 10;
      if (latest.rsi != null && latest.rsi < 30) score += 5;
      score = Math.max(0, Math.min(100, score));

      document.getElementById('signals-list').innerHTML = signals.length
        ? `<div class="signals">${signals.map(s => `<span class="signal-badge ${s.type}">${s.label}</span>`).join('')}</div>`
        : '<div style="color:var(--text-muted)">시그널 없음</div>';

      const sc = scoreColor(score);
      document.getElementById('score-panel').innerHTML = `
        <div style="text-align:center;padding:16px 0">
          <div style="font-size:52px;font-weight:800;color:${sc}">${score}</div>
          <div style="font-size:18px;font-weight:600;color:${sc};margin-top:4px">${scoreLabel(score)}</div>
          <div class="score-bar-wrap" style="margin-top:16px">
            <div class="score-bar" style="flex:1">
              <div class="score-bar-fill" style="width:${score}%;background:${sc}"></div>
            </div>
          </div>
          <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text-muted);margin-top:4px">
            <span>매도</span><span>중립</span><span>매수</span>
          </div>
        </div>
        <div style="margin-top:8px">
          <div style="color:var(--text-muted);font-size:12px;margin-bottom:6px">RSI</div>
          <div class="rsi-meter"><div class="rsi-pointer" style="left:${latest.rsi ?? 50}%"></div></div>
          <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text-muted)">
            <span>0 과매도</span><span>30</span><span>50</span><span>70</span><span>100 과매수</span>
          </div>
        </div>`;
    }

    async function init() {
      initCharts();
      const res = await fetch(`${BASE}/api/stocks/${CODE}?period=365`);
      if (!res.ok) { alert('종목 데이터를 불러오지 못했습니다.'); return; }
      const json = await res.json();
      allData = json.ohlcv;
      renderHeader(json.info, json.summary);
      // 시그널/점수는 차트 렌더링 성공여부와 무관하게 항상 표시
      renderSignalsAndScore(allData);
      try {
        const sliced = sliceData(currentPeriod);
        renderCharts(sliced);
      } catch(e) {
        console.error('차트 렌더링 오류:', e);
      }
      // 52주 고/저 즉시 표시
      const { high_52w, low_52w } = json.summary;
      document.getElementById('f-high').textContent = high_52w ? high_52w.toLocaleString() + '원' : '-';
      document.getElementById('f-low').textContent = low_52w ? low_52w.toLocaleString() + '원' : '-';
      document.getElementById('fundamental-bar').style.display = 'flex';

      // 기본정보(PER/PBR 등) 비동기 로드
      fetch(`${BASE}/api/stocks/${CODE}/fundamental`).then(r => r.json()).then(f => {
        document.getElementById('f-mktcap').textContent = f.market_cap ? (f.market_cap / 1e12).toFixed(1) + '조' : '-';
        document.getElementById('f-per').textContent = f.per ? f.per + '배' : '-';
        document.getElementById('f-pbr').textContent = f.pbr ? f.pbr + '배' : '-';
        document.getElementById('f-div').textContent = f.div ? f.div + '%' : '-';
      }).catch(() => {});

      // 2년 데이터 백그라운드 로드
      fetch(`${BASE}/api/stocks/${CODE}?period=730`).then(r => r.json()).then(j => { allData = j.ohlcv; });
    }

    init();
  </script>
</body>
</html>
