<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>종목 추천 — KR Stock</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <nav>
    <a class="nav-logo" href="/">KR Stock</a>
    <div class="nav-links">
      <a href="/">홈</a>
      <a href="/screener" class="active">종목 추천</a>
    </div>
    <div class="search-bar">
      <div class="search-wrapper">
        <input id="nav-search" type="text" placeholder="종목명 또는 코드 검색">
        <div class="search-dropdown" id="nav-dropdown"></div>
      </div>
      <button onclick="navSearch()">검색</button>
    </div>
  </nav>

  <div class="container">
    <div class="section-title" style="margin-bottom:8px">
      기술적 분석 종목 추천 스크리너
    </div>
    <p style="color:var(--text-muted);margin-bottom:20px;font-size:13px">
      RSI · MACD · 볼린저밴드 · 이동평균선을 종합 분석하여 매수 신호가 강한 종목을 추천합니다.
    </p>

    <!-- 스크리닝 기준 설명 -->
    <div class="grid-4" style="margin-bottom:20px">
      <div class="card" style="text-align:center;padding:16px">
        <div style="font-size:20px;margin-bottom:6px">📊</div>
        <div style="font-weight:600;margin-bottom:4px">RSI</div>
        <div style="color:var(--text-muted);font-size:12px">30~50 구간<br>과매도 회복 시그널</div>
      </div>
      <div class="card" style="text-align:center;padding:16px">
        <div style="font-size:20px;margin-bottom:6px">📈</div>
        <div style="font-weight:600;margin-bottom:4px">MACD</div>
        <div style="color:var(--text-muted);font-size:12px">골든크로스<br>상승 모멘텀</div>
      </div>
      <div class="card" style="text-align:center;padding:16px">
        <div style="font-size:20px;margin-bottom:6px">〰️</div>
        <div style="font-weight:600;margin-bottom:4px">볼린저밴드</div>
        <div style="color:var(--text-muted);font-size:12px">하단 지지<br>반등 가능성</div>
      </div>
      <div class="card" style="text-align:center;padding:16px">
        <div style="font-size:20px;margin-bottom:6px">↗️</div>
        <div style="font-weight:600;margin-bottom:4px">이동평균 정배열</div>
        <div style="color:var(--text-muted);font-size:12px">5/20/60 정배열<br>추세 확인</div>
      </div>
    </div>

    <!-- 컨트롤 -->
    <div class="card" style="margin-bottom:16px">
      <div class="filter-row">
        <button class="btn btn-success" id="run-btn" onclick="runScreener()">스크리닝 시작</button>
        <div style="margin-left:8px;color:var(--text-muted);font-size:13px" id="status-text">결과가 없습니다. 스크리닝을 시작하세요.</div>
      </div>
      <div class="filter-row" style="margin-top:8px">
        <span style="color:var(--text-muted);font-size:13px">시장:</span>
        <button class="btn btn-outline active" onclick="filterMarket('ALL',this)">전체</button>
        <button class="btn btn-outline" onclick="filterMarket('KOSPI',this)">KOSPI</button>
        <button class="btn btn-outline" onclick="filterMarket('KOSDAQ',this)">KOSDAQ</button>
        <span style="color:var(--text-muted);font-size:13px;margin-left:8px">시그널:</span>
        <button class="btn btn-outline active signal-filter-btn" onclick="filterSignal('all',this)">전체</button>
        <button class="btn btn-outline signal-filter-btn" onclick="filterSignal('golden_cross',this)">골든크로스</button>
        <button class="btn btn-outline signal-filter-btn" onclick="filterSignal('volume',this)">거래량 급증</button>
        <button class="btn btn-outline signal-filter-btn" onclick="filterSignal('ma_aligned',this)">정배열</button>
        <span style="color:var(--text-muted);font-size:13px;margin-left:8px">최소 점수:</span>
        <select id="min-score" onchange="applyFilters()" style="background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:6px 10px">
          <option value="50">50+</option>
          <option value="60" selected>60+</option>
          <option value="70">70+</option>
          <option value="80">80+</option>
        </select>
      </div>
      <div class="progress-bar" id="progress-bar" style="display:none">
        <div class="progress-fill" id="progress-fill" style="width:0%"></div>
      </div>
    </div>

    <!-- 결과 테이블 -->
    <div class="card">
      <div id="results-container">
        <div style="color:var(--text-muted);text-align:center;padding:40px">스크리닝 시작 버튼을 눌러 분석을 시작하세요.</div>
      </div>
    </div>
  </div>

  <script>
    const BASE = 'https://stock-analysis-i3xj.onrender.com';
    let allResults = [];
    let currentMarket = 'ALL';
    let currentSignalFilter = 'all';
    let pollTimer;

    const SIGNAL_LABEL_MAP = {
      golden_cross: 'MACD 골든크로스',
      volume: '거래량 급증',
      ma_aligned: '이동평균 정배열',
    };

    function filterSignal(type, btn) {
      currentSignalFilter = type;
      document.querySelectorAll('.signal-filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderFiltered();
    }

    function renderFiltered() {
      let data = allResults;
      const minScore = parseInt(document.getElementById('min-score').value);
      if (currentMarket !== 'ALL') data = data.filter(r => r.market === currentMarket);
      data = data.filter(r => r.score >= minScore);
      if (currentSignalFilter !== 'all') {
        const target = SIGNAL_LABEL_MAP[currentSignalFilter];
        data = data.filter(r => r.signals && r.signals.some(s => s.label.startsWith(target.split(' ')[0])));
      }
      document.getElementById('status-text').textContent = `${data.length}개 종목`;
      renderResults(data);
    }

    // 검색
    function setupSearch() {
      const input = document.getElementById('nav-search');
      const dropdown = document.getElementById('nav-dropdown');
      let timer;
      input.addEventListener('input', () => {
        clearTimeout(timer);
        const q = input.value.trim();
        if (!q) { dropdown.classList.remove('open'); return; }
        timer = setTimeout(async () => {
          const res = await fetch(`${BASE}/api/stocks/search?q=${encodeURIComponent(q)}`);
          const data = await res.json();
          if (!data.results.length) { dropdown.classList.remove('open'); return; }
          dropdown.innerHTML = data.results.map(s =>
            `<div class="search-item" onclick="goTo('${s.code}')"><span>${s.name}</span><span class="code">${s.code} <span class="market-badge">${s.market}</span></span></div>`
          ).join('');
          dropdown.classList.add('open');
        }, 250);
      });
      document.addEventListener('click', e => { if (!e.target.closest('.search-wrapper')) dropdown.classList.remove('open'); });
    }
    function goTo(code) { window.location.href = `/chart?code=${code}`; }
    function navSearch() { const v = document.getElementById('nav-search').value.trim(); if (v) goTo(v); }
    setupSearch();

    async function runScreener() {
      const btn = document.getElementById('run-btn');
      btn.disabled = true;
      btn.textContent = '분석 중...';
      document.getElementById('progress-bar').style.display = 'block';
      animateProgress();

      const res = await fetch(`${BASE}/api/screener/run?top_n=50`);
      const data = await res.json();
      if (data.status === 'done') {
        await fetchResults();
      } else {
        pollTimer = setInterval(async () => {
          const st = await fetch(`${BASE}/api/screener/status`).then(r => r.json());
          const pct = st.total > 0 ? Math.round(st.progress / st.total * 100) : 0;
          document.getElementById('status-text').textContent = `분석 중... ${st.progress}/${st.total}개 (${pct}%)`;
          if (st.status === 'done') {
            clearInterval(pollTimer);
            await fetchResults();
            resetBtn();
          }
        }, 1500);
      }
    }

    let progressVal = 0;
    function animateProgress() {
      progressVal = 0;
      const fill = document.getElementById('progress-fill');
      const iv = setInterval(() => {
        if (progressVal >= 90) { clearInterval(iv); return; }
        progressVal += Math.random() * 3;
        fill.style.width = progressVal + '%';
      }, 300);
    }

    function resetBtn() {
      const btn = document.getElementById('run-btn');
      btn.disabled = false;
      btn.textContent = '다시 스크리닝';
      document.getElementById('progress-fill').style.width = '100%';
      setTimeout(() => { document.getElementById('progress-bar').style.display = 'none'; }, 500);
    }

    async function fetchResults() {
      const minScore = document.getElementById('min-score').value;
      const res = await fetch(`${BASE}/api/screener/results?min_score=${minScore}&market=${currentMarket}&limit=100`);
      const data = await res.json();
      allResults = data.results || [];
      renderFiltered();
      resetBtn();
    }

    function applyFilters() { allResults.length ? renderFiltered() : fetchResults(); }

    function filterMarket(market, btn) {
      currentMarket = market;
      document.querySelectorAll('.filter-row .btn-outline:not(.signal-filter-btn)').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderFiltered();
    }

    function scoreColor(s) {
      if (s >= 75) return '#3fb950';
      if (s >= 55) return '#f0b429';
      return '#f85149';
    }

    function renderResults(results) {
      const container = document.getElementById('results-container');
      if (!results.length) {
        container.innerHTML = '<div style="color:var(--text-muted);text-align:center;padding:40px">조건에 맞는 종목이 없습니다.</div>';
        return;
      }

      const rows = results.map((r, i) => {
        const sign = r.change_pct >= 0 ? '+' : '';
        const cls = r.change_pct >= 0 ? 'up' : 'down';
        const sc = scoreColor(r.score);
        const signals = (r.signals || []).slice(0, 3).map(s =>
          `<span class="signal-badge ${s.type}">${s.label}</span>`
        ).join('');

        return `
          <tr onclick="goTo('${r.code}')" style="cursor:pointer">
            <td style="color:var(--text-muted);font-size:12px">${i+1}</td>
            <td><div class="stock-name-cell"><span class="name">${r.name}</span><span class="code">${r.code}</span></div></td>
            <td><span class="market-badge">${r.market}</span></td>
            <td style="font-weight:600">${r.close.toLocaleString()}원</td>
            <td class="${cls}">${sign}${r.change_pct}%</td>
            <td>${r.rsi != null ? r.rsi : '-'}</td>
            <td>
              <div class="score-bar-wrap">
                <div class="score-bar" style="width:80px">
                  <div class="score-bar-fill" style="width:${r.score}%;background:${sc}"></div>
                </div>
                <span class="score-label" style="color:${sc}">${r.score}</span>
              </div>
            </td>
            <td><div class="signals">${signals}</div></td>
          </tr>`;
      }).join('');

      container.innerHTML = `<div class="table-scroll"><table>
          <thead>
            <tr>
              <th class="hide-mobile">#</th><th>종목</th><th class="hide-mobile">시장</th><th>현재가</th><th>등락률</th><th class="hide-mobile">RSI</th><th>점수</th><th class="hide-mobile">시그널</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table></div>`;
    }

    // 캐시된 결과 자동 로드
    (async () => {
      const st = await fetch(`${BASE}/api/screener/status`).then(r => r.json());
      if (st.status === 'done' && st.count > 0) {
        await fetchResults();
        document.getElementById('run-btn').textContent = '다시 스크리닝';
      }
    })();
  </script>
</body>
</html>
