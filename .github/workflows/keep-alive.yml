name: Keep Render Alive

on:
  schedule:
    - cron: '*/10 * * * *'  # 10분마다 실행
  workflow_dispatch:         # 수동 실행 가능

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render server
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://stock-analysis-i3xj.onrender.com/)
          echo "Response: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Warning: Server returned $STATUS"
          else
            echo "Server is alive!"
          fi
